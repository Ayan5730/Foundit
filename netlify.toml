[build]
  command = "npm run build:netlify"
  publish = ".next-netlify"

[build.environment]
  NODE_VERSION = "24"
  FOUNDIT_DEPLOY_TARGET = "netlify"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  command = "npm run dev:netlify"
  targetPort = 3000
  port = 8888
  framework = "#custom"
